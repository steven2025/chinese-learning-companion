<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16373a">
  <title>中级综合1 第1课 · 点点汉语</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="styles.css?v=20260804-1">
</head>
<body>
  <div class="book-app">
    <header class="book-toolbar">
      <a class="brand-link" href="../learning-hub/" aria-label="返回点点汉语学习中心 / Back to learning hub" title="返回学习中心 / Back to learning hub">
        <img src="../../icons/icon-96.png" alt="">
        <span><strong>点点汉语</strong><small>中级综合1 · 第1课</small></span>
      </a>

      <nav class="section-tabs" aria-label="课程部分">
        <button type="button" data-section="vocabulary"><span class="bilingual-button-label"><strong>词语</strong><small>Vocabulary</small></span></button>
        <button type="button" data-section="text"><span class="bilingual-button-label"><strong>课文</strong><small>Text</small></span></button>
        <button type="button" data-section="practice"><span class="bilingual-button-label"><strong>练习</strong><small>Practice</small></span></button>
      </nav>

      <div class="toolbar-settings">
        <div class="assist-switch" role="group" aria-label="母语辅助模式">
          <button type="button" data-assist-mode="immersion"><span class="bilingual-button-label"><strong>中文沉浸</strong><small>Chinese only</small></span></button>
          <button type="button" data-assist-mode="assist"><span class="bilingual-button-label"><strong>母语辅助</strong><small>Native-language aid</small></span></button>
          <button type="button" data-assist-mode="bilingual"><span class="bilingual-button-label"><strong>双语对照</strong><small>Bilingual</small></span></button>
        </div>
        <label class="language-select">
          <span>辅助语言 <small>Support language</small></span>
          <select id="languageSelect" aria-label="选择辅助语言"></select>
        </label>
      </div>
    </header>

    <main class="lesson-main">
      <section class="unit-shell" aria-labelledby="unitTitle">
        <header class="unit-heading">
          <div>
            <span class="unit-kicker" id="unitKicker">第1课 · 你咋不早说</span>
            <h1 id="unitTitle">正在载入</h1>
            <p id="unitProgress">准备课程内容</p>
          </div>
          <label class="unit-jump">
            <span>跳转到 <small>Jump to</small></span>
            <select id="unitSelect" aria-label="选择学习单元"></select>
          </label>
        </header>

        <div class="learning-workspace" id="learningWorkspace">
          <div class="lesson-column">
            <article class="learning-unit" id="unitContent" aria-live="polite"></article>

            <section class="audio-dock" aria-label="课程音频播放器">
              <audio id="lessonAudio" preload="metadata"></audio>
              <button class="audio-main-button" id="playButton" type="button" aria-label="播放当前内容 / Play current item" title="播放当前内容 / Play current item">▶</button>
              <div class="audio-current">
                <span id="audioStatus">准备播放</span>
                <strong id="audioLabel">当前学习单元</strong>
              </div>
              <input id="audioSeek" type="range" min="0" max="1000" value="0" aria-label="音频进度">
              <span class="audio-time" id="audioTime">00:00 / 00:00</span>
              <label class="speed-control">
                <span>速度 <small>Speed</small></span>
                <select id="speedSelect" aria-label="播放速度">
                  <option value="0.75">0.75×</option>
                  <option value="1" selected>1×</option>
                  <option value="1.25">1.25×</option>
                </select>
              </label>
              <button class="icon-button" id="continuousButton" type="button" aria-pressed="false" aria-label="连续播放 / Continuous play" title="连续播放 / Continuous play">⇥</button>
              <button class="icon-button" id="loopButton" type="button" aria-pressed="false" aria-label="循环当前单元 / Loop current unit" title="循环当前单元 / Loop current unit">↻</button>
            </section>
          </div>

        </div>

        <footer class="unit-navigation">
          <button type="button" id="previousUnitButton"><span class="button-icon" aria-hidden="true">‹</span><span class="bilingual-button-label"><strong>上一个</strong><small>Previous</small></span></button>
          <strong id="footerProgress">1 / 1</strong>
          <button type="button" id="nextUnitButton"><span class="bilingual-button-label"><strong>下一个</strong><small>Next</small></span><span class="button-icon" aria-hidden="true">›</span></button>
        </footer>
      </section>
    </main>
  </div>
  <dialog class="writing-dialog" id="wordWritingDialog" aria-labelledby="wordWritingTitle">
    <div id="wordWritingContent"></div>
  </dialog>
  <section class="practice-writing-panel" id="practiceWritingPanel" hidden aria-labelledby="practiceWritingTitle">
    <div id="practiceWritingContent"></div>
  </section>
  <section class="assist-zone" id="assistWindow" hidden aria-labelledby="assistTitle">
    <header class="assist-header" data-assist-drag-handle>
      <div>
        <span id="assistContext">当前学习单元</span>
        <h2 id="assistTitle">AI 精准伴学</h2>
      </div>
      <div class="assist-window-actions">
        <button type="button" data-assist-window-command="fullscreen" aria-label="全屏 / Full screen" title="全屏 / Full screen">⛶</button>
        <button type="button" data-assist-window-command="close" aria-label="关闭 / Close" title="关闭 / Close">×</button>
      </div>
    </header>
    <div class="assist-tabs" id="assistTabs" role="tablist" aria-label="伴学功能"></div>
    <div class="assist-content" id="assistContent"></div>
  </section>
  <aside class="ai-work-indicator" id="aiWorkIndicator" hidden aria-label="AI 工作状态 / AI work status"></aside>
  <script src="../../vendor/hanzi-writer.min.js?v=20260731-16"></script>
  <script src="../shared/voice-orb.js?v=20260801-1"></script>
  <script src="../../config.js?v=20260801-2"></script>
  <script src="../shared/learning-api-client.js?v=20260802-1"></script>
  <script src="book-data.js?v=20260804-1"></script>
  <script src="stroke-data.js?v=20260731-16"></script>
  <script src="app.js?v=20260804-6" defer></script>
</body>
</html>
