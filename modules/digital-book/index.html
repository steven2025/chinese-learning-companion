<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16373a">
  <title>中级综合1 第1课 · 智能伴学数字书</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png">
  <link rel="stylesheet" href="styles.css?v=20260801-1">
</head>
<body>
  <div class="book-app">
    <header class="book-toolbar">
      <a class="brand-link" href="../learning-hub/" aria-label="返回天天汉语伴学学习中心">
        <img src="../../icons/icon-96.png" alt="">
        <span><strong>智能伴学数字书</strong><small>中级综合1 · 第1课</small></span>
      </a>

      <nav class="section-tabs" aria-label="课程部分">
        <button type="button" data-section="vocabulary">词语</button>
        <button type="button" data-section="text">课文</button>
        <button type="button" data-section="practice">练习</button>
      </nav>

      <div class="toolbar-settings">
        <div class="assist-switch" role="group" aria-label="母语辅助模式">
          <button type="button" data-assist-mode="immersion">中文沉浸</button>
          <button type="button" data-assist-mode="assist">母语辅助</button>
          <button type="button" data-assist-mode="bilingual">双语对照</button>
        </div>
        <label class="language-select">
          <span>辅助语言</span>
          <select id="languageSelect" aria-label="选择辅助语言"></select>
        </label>
      </div>
    </header>

    <main class="lesson-main">
      <section class="unit-shell" aria-labelledby="unitTitle">
        <header class="unit-heading">
          <div>
            <span class="unit-kicker" id="unitKicker">第1课 · 你咋不早说</span>
            <h1 id="unitTitle">正在载入</h1>
            <p id="unitProgress">准备课程内容</p>
          </div>
          <label class="unit-jump">
            <span>跳转到</span>
            <select id="unitSelect" aria-label="选择学习单元"></select>
          </label>
        </header>

        <div class="learning-workspace" id="learningWorkspace">
          <div class="lesson-column">
            <article class="learning-unit" id="unitContent" aria-live="polite"></article>

            <section class="audio-dock" aria-label="课程音频播放器">
              <audio id="lessonAudio" preload="metadata"></audio>
              <button class="audio-main-button" id="playButton" type="button" aria-label="播放当前内容" title="播放当前内容">▶</button>
              <div class="audio-current">
                <span id="audioStatus">准备播放</span>
                <strong id="audioLabel">当前学习单元</strong>
              </div>
              <input id="audioSeek" type="range" min="0" max="1000" value="0" aria-label="音频进度">
              <span class="audio-time" id="audioTime">00:00 / 00:00</span>
              <label class="speed-control">
                <span>速度</span>
                <select id="speedSelect" aria-label="播放速度">
                  <option value="0.75">0.75×</option>
                  <option value="1" selected>1×</option>
                  <option value="1.25">1.25×</option>
                </select>
              </label>
              <button class="icon-button" id="continuousButton" type="button" aria-pressed="false" aria-label="连续播放" title="连续播放">⇥</button>
              <button class="icon-button" id="loopButton" type="button" aria-pressed="false" aria-label="循环当前单元" title="循环当前单元">↻</button>
            </section>
          </div>

          <section class="assist-zone" aria-labelledby="assistTitle">
            <header class="assist-header">
              <div>
                <span>当前学习单元</span>
                <h2 id="assistTitle">AI 精准伴学</h2>
              </div>
              <div class="assist-tabs" id="assistTabs" role="tablist" aria-label="伴学功能"></div>
            </header>
            <div class="assist-content" id="assistContent"></div>
          </section>
        </div>

        <footer class="unit-navigation">
          <button type="button" id="previousUnitButton">‹ <span>上一个</span></button>
          <strong id="footerProgress">1 / 1</strong>
          <button type="button" id="nextUnitButton"><span>下一个</span> ›</button>
        </footer>
      </section>
    </main>
  </div>
  <dialog class="writing-dialog" id="wordWritingDialog" aria-labelledby="wordWritingTitle">
    <div id="wordWritingContent"></div>
  </dialog>
  <section class="practice-writing-panel" id="practiceWritingPanel" hidden aria-labelledby="practiceWritingTitle">
    <div id="practiceWritingContent"></div>
  </section>
  <script src="../../vendor/hanzi-writer.min.js?v=20260731-16"></script>
  <script src="../listening-speaking/js/voice-orb.js?v=20260731-16"></script>
  <script src="../../config.js?v=20260801-2"></script>
  <script src="../shared/learning-api-client.js?v=20260801-2"></script>
  <script src="book-data.js?v=20260731-16"></script>
  <script src="stroke-data.js?v=20260731-16"></script>
  <script src="app.js?v=20260801-4" defer></script>
</body>
</html>
