<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <title>点点老师 · 和老师对话</title>
  <link rel="stylesheet" href="styles.css?v=20260827-1">
  <style>.assist-options{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin:10px 0 0;padding:8px 12px;border:1px solid rgba(206,255,238,.13);border-radius:12px;color:#9bb5ad;font-size:12px}.assist-options legend{padding:0 6px;color:#68f0c1;font-size:11px}.assist-options label{display:flex;align-items:center;gap:5px}.assist-options input{accent-color:#68f0c1}.hanzi{font-size:clamp(30px,7vw,48px);font-weight:800;letter-spacing:.08em;color:#f4fbf8;text-shadow:0 2px 12px rgba(104,240,193,.22)}.pinyin{font-size:16px;font-weight:700;letter-spacing:.05em}</style>
  <style>.quick button small{margin-left:4px;font-size:10px;opacity:.8}.mic span{display:block;font-size:16px;font-weight:800;line-height:1.15}.mic span small{font-size:10px;opacity:.85}.mic{transition:transform .2s,background .2s,border-radius .2s}.mic.active{transform:scale(1.06);border:3px solid rgba(255,255,255,.75)}.mic.speaking{border-radius:18px;background:linear-gradient(135deg,#9fbcff,#6e8ff0 60%,#8b7cf6)}.mic.live{border-radius:18px;background:linear-gradient(135deg,#ffbca9,#ff716f)}.word-card{min-height:150px;display:grid;align-content:center;gap:6px;border-color:rgba(104,240,193,.7);background:linear-gradient(145deg,#123a39,#142b4e 55%,#24194a);box-shadow:0 0 28px rgba(104,240,193,.18),inset 0 0 24px rgba(93,134,255,.12)}.hanzi ruby{display:inline-flex;flex-direction:column-reverse;align-items:center;margin:0 3px}.hanzi rt{font-size:15px;color:#7fffe0;font-weight:700;line-height:1.1}.stage{position:relative}.transcript{display:block;position:absolute;left:58%;top:50%;width:min(42%,430px);max-height:230px;margin:0;transform:translateY(-50%);text-align:left;backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.28)}.transcript li{border-bottom:1px solid rgba(206,255,238,.08);transition:font-size .2s,color .2s}.transcript li:last-child{border-bottom:0}.transcript li:first-child{font-size:17px;color:#f4fbf8}.transcript li:nth-child(2){font-size:15px}.transcript li:nth-child(n+3){font-size:13px}.transcript li.teacher b{color:#7fffe0}.transcript li.student b{color:#9fbcff}@media(max-width:700px) and (orientation:portrait){.transcript{position:static;width:min(100%,620px);max-height:190px;margin-top:14px;transform:none}.stage{min-height:0}.transcript li:first-child{font-size:16px}}@media(max-width:900px) and (orientation:landscape){.transcript{left:54%;width:44%}}</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="round" href="../learning-hub/" aria-label="返回学习中心">‹</a>
      <div class="brand"><strong>点点老师</strong><span id="lessonLabel">为你准备中文对话</span></div>
      <button class="round" id="transcriptToggle" type="button" aria-label="显示对话记录">记</button>
    </header>
    <section class="stage" aria-live="polite">
      <div class="orb-wrap" id="teacherOrb" data-orb-theme="green"><div class="halo"></div><canvas aria-label="点点老师语音状态"></canvas></div>
      <div class="status" id="status">准备开始</div>
      <div class="prompt" id="prompt">登录学生账号后，点麦克风开始和老师对话。</div>
      <fieldset class="assist-options" aria-label="中文辅助选项"><legend>中文辅助 · Chinese support</legend><label><input type="checkbox" id="zhSupport"> 中文辅助 / Chinese help</label><label><input type="checkbox" id="pinyinSupport"> 汉字上方显示拼音 / Pinyin above characters</label></fieldset>
      <div class="word-card" id="wordCard" hidden><div class="hanzi" id="hanzi"></div><div class="pinyin" id="pinyin"></div><div class="meaning" id="meaning"></div></div>
      <section class="transcript" id="transcript" aria-label="实时字幕 / Live subtitles"><ol id="transcriptRows"></ol></section>
    </section>
    <footer class="controls">
      <div class="quick"><button data-action="repeat">再说一遍 <small>Repeat</small></button><button data-action="slower">慢一点 <small>Slower</small></button><button data-action="hint">提示 <small>Hint</small></button></div>
      <div class="main-actions"><button class="minor" id="keyboard" aria-label="文字输入 / Text input">⌨</button><button class="mic" id="mic" aria-label="开始对话 / Start conversation"><span id="micLabel">开始<br><small>Start</small></span></button><button class="minor" id="end" aria-label="结束对话 / End conversation">×</button></div>
      <div class="caption" id="caption">需要麦克风权限 · 对话音频实时传输，不写入前端</div>
    </footer>
  </main>
  <dialog id="textDialog"><form method="dialog"><label>输入你想说的话<textarea id="textInput" maxlength="500"></textarea></label><div><button value="cancel">取消</button><button id="sendText" value="default">发送</button></div></form></dialog>
  <script src="../../config.js?v=20260827-2"></script>
  <script src="../shared/learning-api-client.js?v=20260827-1"></script>
  <script src="../shared/voice-orb.js?v=20260801-1"></script>
  <script src="app.js?v=20260827-1"></script>
</body>
</html>
