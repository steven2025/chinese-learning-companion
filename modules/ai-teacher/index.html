<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <title>点点老师 · 和老师对话</title>
  <link rel="stylesheet" href="styles.css?v=20260827-1">
  <style>.assist-options{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin:10px 0 0;padding:8px 12px;border:1px solid rgba(206,255,238,.13);border-radius:12px;color:#9bb5ad;font-size:12px}.assist-options legend{padding:0 6px;color:#68f0c1;font-size:11px}.assist-options label{display:flex;align-items:center;gap:5px}.assist-options input{accent-color:#68f0c1}.hanzi{font-size:clamp(30px,7vw,48px);font-weight:800;letter-spacing:.08em;color:#f4fbf8;text-shadow:0 2px 12px rgba(104,240,193,.22)}.pinyin{font-size:16px;font-weight:700;letter-spacing:.05em}</style>
  <style>.orb-wrap{display:grid;place-items:center}.orb-toggle{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border:1px solid rgba(255,255,255,.7);border-radius:50%;background:rgba(7,17,15,.72);backdrop-filter:blur(10px);color:#f4fbf8;box-shadow:0 0 28px rgba(104,240,193,.3);cursor:pointer}.orb-toggle span{display:block;font-size:15px;font-weight:800;line-height:1.15}.orb-toggle span small{font-size:10px;opacity:.8}.orb-state{position:absolute;z-index:2;left:50%;top:calc(50% + 58px);transform:translateX(-50%);white-space:nowrap;color:#f4fbf8;font-size:12px;text-shadow:0 1px 8px #07110f}.mic.active{border-color:#7fffe0}.mic.speaking{border-radius:50%;background:rgba(35,51,105,.82)}.mic.live{border-radius:50%;background:rgba(91,38,40,.82)}.stage{min-height:calc(100vh - 130px)}.status,.prompt,.assist-options,.word-card,.transcript,.controls{display:none!important}</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="round" href="../learning-hub/" aria-label="返回学习中心">‹</a>
      <div class="brand"><strong>点点老师</strong><span id="lessonLabel">为你准备中文对话</span></div>
      <button class="round" id="transcriptToggle" type="button" aria-label="显示对话记录">记</button>
    </header>
    <section class="stage" aria-live="polite">
      <div class="orb-wrap" id="teacherOrb" data-orb-theme="green"><div class="halo"></div><canvas aria-label="点点老师语音状态"></canvas><button class="orb-toggle mic" id="mic" type="button" aria-label="点点老师连接已暂停 / AI teacher connection paused"><span id="micLabel">已暂停<br><small>Paused</small></span></button><div class="orb-state" id="status">连接已暂停 / Connection paused</div></div>
    </section>
  </main>
  <div hidden><button id="end"></button><button id="keyboard"></button></div>
  <dialog id="textDialog"><form method="dialog"><label>输入你想说的话<textarea id="textInput" maxlength="500"></textarea></label><div><button value="cancel">取消</button><button id="sendText" value="default">发送</button></div></form></dialog>
  <script src="../../config.js?v=20260827-2"></script>
  <script src="../shared/learning-api-client.js?v=20260827-1"></script>
  <script src="../shared/voice-orb.js?v=20260801-1"></script>
  <script src="app.js?v=20260827-1"></script>
</body>
</html>
