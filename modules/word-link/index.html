<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153f42">
  <title>单词连连看 · 点点汉语</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png">
  <link rel="stylesheet" href="styles.css?v=20260806-1">
</head>
<body>
  <main class="game-shell">
    <header class="game-bar">
      <a class="icon-button back-button" href="../learning-hub/" aria-label="返回学习中心" title="返回 / Back">‹</a>
      <a class="brand" href="../learning-hub/">
        <img src="../../icons/icon-96.png" alt="">
        <span><strong>单词连连看</strong><small>Word Link</small></span>
      </a>

      <div class="source-switch" role="group" aria-label="词库">
        <button type="button" data-source="developing" aria-pressed="true"><b>发展汉语</b><small>Developing Chinese</small></button>
        <button type="button" data-source="hsk" aria-pressed="false"><b>HSK词汇</b><small>HSK Vocabulary</small></button>
      </div>

      <label class="language-control">
        <span>辅助语言 <small>Support language</small></span>
        <select id="languageSelect" aria-label="辅助语言"></select>
      </label>
    </header>

    <section class="status-bar" aria-live="polite">
      <div><span id="sourceKicker">发展汉语 · 中级综合 I</span><h1 id="setTitle">第1—2课教材词汇</h1></div>
      <div class="round-progress"><span id="roundLabel">第 1 轮</span><i><b id="progressFill"></b></i><small id="wordProgress">0 / 0</small></div>
      <div class="score-panel"><span>得分 <b id="scoreValue">0</b></span><span>失误 <b id="mistakeValue">0</b></span></div>
    </section>

    <section class="board-wrap" aria-labelledby="boardTitle">
      <header class="board-heading">
        <div><span>本轮任务</span><h2 id="boardTitle">连起汉字、拼音和词义</h2></div>
        <p id="feedback" role="status">每列选择一项，组成同一个词。</p>
      </header>

      <div class="column-headings" aria-hidden="true">
        <span>汉字 <small>Chinese</small></span>
        <span>拼音 <small>Pinyin</small></span>
        <span id="meaningHeading">词义 <small>Meaning</small></span>
      </div>
      <div class="match-board" id="matchBoard">
        <div class="tile-column" id="hanziColumn" data-kind="hanzi"></div>
        <div class="tile-column" id="pinyinColumn" data-kind="pinyin"></div>
        <div class="tile-column" id="meaningColumn" data-kind="meaning"></div>
      </div>

      <footer class="game-actions">
        <button class="action-button teal" id="hintButton" type="button"><span>?</span><b>提示</b><small>Hint</small></button>
        <button class="action-button blue" id="shuffleButton" type="button"><span>↻</span><b>重排</b><small>Shuffle</small></button>
        <button class="action-button coral" id="soundButton" type="button" aria-pressed="true"><span>♪</span><b>声音</b><small>Sound</small></button>
      </footer>
    </section>
  </main>

  <section class="dialog-layer" id="roundDialog" hidden>
    <div class="result-dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <span id="resultKicker">本轮完成</span>
      <h2 id="resultTitle">五组词语全部连对了</h2>
      <strong id="roundScore">+500</strong>
      <p id="resultText"></p>
      <button id="nextRoundButton" type="button"><b>下一轮</b><small>Next round</small></button>
      <button class="text-button" id="replayButton" type="button">重新练习本词库 / Restart</button>
    </div>
  </section>

  <section class="loading-layer" id="loadingLayer" aria-live="polite">
    <div class="loader"><i></i><span>正在读取词库</span><small>Loading vocabulary</small></div>
  </section>

  <script src="app.js?v=20260806-1" defer></script>
</body>
</html>
